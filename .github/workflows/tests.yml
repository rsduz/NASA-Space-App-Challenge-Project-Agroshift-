name: Tests
on: [push, pull_request]
jobs:
  test:
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agroshift_test
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agroshift_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGROSHIFT_TEST_PG_ADMIN: postgresql://agroshift_test:disposable_test_only@localhost:5432/postgres
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt -r requirements-db.txt
      - run: python -m pip check
      - run: python -m pytest --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml
