services:
  database:
    image: postgres:18-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395
    environment:
      POSTGRES_DB: agroshift
      POSTGRES_USER: agroshift_admin
      POSTGRES_PASSWORD: ${AGROSHIFT_LOCAL_ADMIN_PASSWORD:?Run python -m scripts.dev_database up first}
    ports:
      - "127.0.0.1:56542:5432"
    volumes:
      - agroshift_database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agroshift_admin -d agroshift"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  agroshift_database:
