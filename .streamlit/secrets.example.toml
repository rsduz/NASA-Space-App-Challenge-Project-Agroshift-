# Optional OIDC. Copy to secrets.toml (ignored by Git); use real provider credentials.
# Set AGROSHIFT_OIDC_ISSUER to the exact "issuer" returned by provider discovery.
# Set AGROSHIFT_PRIVATE_DATABASE_URL to the restricted agroshift_app connection.
[auth]
redirect_uri = "http://localhost:8501/oauth2callback"
cookie_secret = "REPLACE_WITH_A_LONG_RANDOM_SECRET"
client_id = "YOUR_PROVIDER_CLIENT_ID"
client_secret = "YOUR_PROVIDER_CLIENT_SECRET"
server_metadata_url = "https://YOUR_PROVIDER/.well-known/openid-configuration"
