[theme]
primaryColor = "#1F6B3A"
backgroundColor = "#F7F5EF"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2A21"
greenColor = "#1F6B3A"
greenTextColor = "#17643A"
greenBackgroundColor = "#E6F4EA"
blueColor = "#1F5F9E"
blueTextColor = "#1F5F9E"
blueBackgroundColor = "#E8F1FA"
orangeTextColor = "#7A4D00"
orangeBackgroundColor = "#FDF2D8"
yellowTextColor = "#7A4D00"
yellowBackgroundColor = "#FDF2D8"
redTextColor = "#A11B1B"
redBackgroundColor = "#FCE6E6"
font = "Inter, sans-serif"
baseFontSize = 16
headingFontSizes = ["1.875rem", "1.375rem", "1.125rem"]
headingFontWeights = [650, 600, 600]
baseRadius = "12px"
buttonRadius = "10px"
borderColor = "#8A968C"
showWidgetBorder = true

[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"
style = "normal"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[server]
headless = true
maxUploadSize = 5
enableStaticServing = true
